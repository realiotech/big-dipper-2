query EvmAssetOverview($address: ID!) {
  erc20Contract(id: $address) {
    id
    name
    symbol
    decimals
    totalSupply {
      value
    }
  }
}

query EvmAssetHolders($offset: Int = 1, $limit: Int = 10) {
  erc20Balances(orderBy: value, orderDirection: desc, first: $limit, skip: $offset) {
    account {
      id
    }
    value
  }
}

query EvmAssetTransfers($offset: Int = 0, $limit: Int = 10) {
  erc20Transfers(where: {
      from_not: null,
      to_not: null
    }, orderBy: timestamp, orderDirection: desc, first: $limit, skip: $offset) {
    from {
      id
    }
    to {
      id
    }
    value
    timestamp
    transaction {
      id
    }
  }
}

query EvmAssetMints($offset: Int = 0, $limit: Int = 10) {
  erc20Transfers(where: {
      from: null,
      to_not: null
    }, orderBy: timestamp, orderDirection: desc, first: $limit, skip: $offset) {
    to {
      id
    }
    value
    timestamp
    transaction {
      id
    }
  }
}

query EvmAssetBurns($offset: Int = 0, $limit: Int = 10) {
  erc20Transfers(where: {
      from_not: null,
      to: null
    }, orderBy: timestamp, orderDirection: desc, first: $limit, skip: $offset) {
    from {
      id
    }
    value
    timestamp
    transaction {
      id
    }
  }
}