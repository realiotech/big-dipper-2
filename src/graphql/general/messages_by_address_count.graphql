query GetMessagesByAddressCount($address: _text, $types: _text = "{}", $where: message_bool_exp = {}) {
  messagesByAddressAggregate: messages_by_address_aggregate(
    args: {addresses: $address, types: $types, limit: 100000, offset: 0}
    where: $where
  ) {
    aggregate {
      count
    }
  }
}
