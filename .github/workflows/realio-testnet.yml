name: realio-testnet

on:
  push:
    branches:
      - chains/realio-testnet
    paths:
      - '*'
      - '**'
      - '!.github/**'
      - '!README.md'
      - '!.gitignore'
  workflow_dispatch:

jobs:
  build:
    runs-on: [ubuntu-latest]
    environment: realio-testnet
    steps:
      - name: Checkout
        uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5 # v2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ secrets.IMAGE_REGISTRY_URL }}
          username: ${{ secrets.IMAGE_REGISTRY_USER }}
          password: ${{ secrets.ACCESS_TOKEN }}
      - name: GitHub Actions Cache Docker layers
        uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ github.workflow }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ github.workflow }}-buildx-${{ github.sha }}
            ${{ github.workflow }}
      - uses: 1password/install-cli-action@9a0c9dd934086b7ab1d90115d455bda1c53c2bdb # v2
      - name: Load REALIO_PUBLIC vars
        env:
          OP_VAULT: gitops-pubrepo-stage
          OP_ITEM: bigdipper-envvars
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN_PUBLIC_STAGE }}
        run: |
          op item get $OP_ITEM --vault $OP_VAULT --reveal --format json | jq '.fields[].label' | tail -n +3 | while IFS= read -r line; do
            value=$(op item get $OP_ITEM --vault $OP_VAULT --fields $line --reveal)
            if [ $? -ne 0 ]; then
              echo "Failed to retrieve $line"
              exit 1
            fi
            echo "::add-mask::$value"
            echo "$line=$value" | tr -d '"' >> $GITHUB_ENV
            echo "$line set" | tr -d '"'
          done
      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          push: true
          tags: ${{ secrets.IMAGE_REGISTRY_URL }}/${{ secrets.IMAGE_REPO }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }}-${{ github.run_number }}
          build-args: |
            NEXT_PUBLIC_API_URL
            NEXT_PUBLIC_CHAIN_TYPE
            NEXT_PUBLIC_GRAPHQL_URL
            NEXT_PUBLIC_GRAPHQL_WS
            NEXT_PUBLIC_JSON_RPC_URL
            NEXT_PUBLIC_RPC_API
            NEXT_PUBLIC_RPC_URL
            NEXT_PUBLIC_RPC_WEBSOCKET
            NEXT_PUBLIC_SUBGRAPHQL_URL
            NODE_ENV
            PORT
            PRICE_API_KEY
            PRICE_API_URL
          file: Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
  update-gitops:
    needs: build
    environment: realio-testnet
    runs-on: [ubuntu-latest]
    steps:
    - name: Checkout gitops repository
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      with:
        token: ${{ secrets.GITOPS_PAT }}
        repository: ${{ secrets.GITOPS_REPO }}
        ref: main
    - name: Update manifest
      run: |
        if cat ${{ secrets.MANIFEST_PATH }} | grep ${{ github.sha }}-${{ github.run_number }}; then
          echo "Image tag already exists in the manifest"
          exit 0
        fi
        sed -i 's|image: .*$|image: '"${{ secrets.IMAGE_REGISTRY_URL }}/${{ secrets.IMAGE_REPO }}/${{ secrets.IMAGE_NAME }}:${{ github.sha }}-${{ github.run_number }}"'|' ${{ secrets.MANIFEST_PATH }}
        git config user.name 'github-actions-bot'
        git config user.email '${{ secrets.IMAGE_REGISTRY_USER }}'
        git add .
        git commit -m 'Update image tag to ${{ github.sha }}-${{ github.run_number }}'
        git pull --rebase
        git push
    env:
      GITHUB_TOKEN: ${{ secrets.GITOPS_PAT }}